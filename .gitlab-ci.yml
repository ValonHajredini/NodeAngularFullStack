workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "production"

stages:
  - build-shared
  - deploy-backend
  - deploy-frontend

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - packages/shared/node_modules/
    - packages/shared/dist/

# ============================================
# STAGE 1: Build Shared Package
# ============================================
build_shared_package:
  stage: build-shared
  image: node:20-alpine
  script:
    - echo "Building shared package..."
    - npm ci --ignore-scripts --include=dev
    - npm --workspace=packages/shared run build
  artifacts:
    paths:
      - packages/shared/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ============================================
# STAGE 2: Deploy Backend APIs with PM2
# ============================================
deploy_backend_apis:
  stage: deploy-backend
  image: node:20-alpine
  dependencies:
    - build_shared_package
  before_script:
    # Install SSH client
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Create SSH key file from base64-encoded variable
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts
    # Debug SSH connection
    - echo "=== SSH Connection Debug Info ==="
    - echo "User - $PROD_SSH_USER"
    - echo "Host - $PROD_SSH_HOST"
    - echo "Testing SSH connection with verbose output..."
    - ssh -vvv -o StrictHostKeyChecking=no $PROD_SSH_USER@$PROD_SSH_HOST "echo SSH connection successful"
  script:
    - echo "Deploying backend APIs to production..."

    # Create deployment directory structure on server
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/{apps/{dashboard-api,forms-api},packages/shared,scripts}"

    # Copy shared package dist
    - rsync -avz --delete packages/shared/dist/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/dist/
    - rsync -avz packages/shared/package.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/

    # Copy backend API source files
    - rsync -avz --delete --exclude 'node_modules' --exclude 'dist' --exclude 'coverage' --exclude 'logs' --exclude 'uploads' apps/dashboard-api/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/apps/dashboard-api/
    - rsync -avz --delete --exclude 'node_modules' --exclude 'dist' --exclude 'coverage' --exclude 'logs' --exclude 'uploads' --exclude 'exports' apps/forms-api/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/apps/forms-api/

    # Copy root package files
    - rsync -avz package.json package-lock.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/

    # Copy PM2 ecosystem config
    - rsync -avz ecosystem.config.js $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/

    # Copy deployment scripts
    - rsync -avz scripts/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/scripts/

    # Execute deployment script on server
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "bash $PROD_DEPLOY_PATH/scripts/deploy-backend.sh $PROD_DEPLOY_PATH"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ============================================
# STAGE 3: Deploy Frontend Applications
# ============================================
deploy_frontend_main_ui:
  stage: deploy-frontend
  image: node:20-alpine
  dependencies:
    - build_shared_package
    - deploy_backend_apis
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Create SSH key file from base64-encoded variable
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Building and deploying main UI (apps/web)..."

    # Install dependencies
    - npm ci --ignore-scripts

    # Build main UI with production configuration
    - npm --workspace=apps/web run build -- --configuration=production

    # Create frontend deployment directory on server
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/frontend/web"

    # Clear old frontend files
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "rm -rf $PROD_DEPLOY_PATH/frontend/web/*"

    # Deploy built files
    - rsync -avz --delete apps/web/dist/web/browser/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/frontend/web/

    - echo "Main UI deployed successfully to $PROD_DEPLOY_PATH/frontend/web"
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy_frontend_form_builder:
  stage: deploy-frontend
  image: node:20-alpine
  dependencies:
    - build_shared_package
    - deploy_backend_apis
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    # Create SSH key file from base64-encoded variable
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Building and deploying Form Builder UI (apps/form-builder-ui)..."

    # Install dependencies
    - npm ci --ignore-scripts

    # Build form builder UI with production configuration
    - npm --workspace=apps/form-builder-ui run build -- --configuration=production

    # Create frontend deployment directory on server
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/frontend/form-builder"

    # Clear old frontend files
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "rm -rf $PROD_DEPLOY_PATH/frontend/form-builder/*"

    # Deploy built files
    - rsync -avz --delete apps/form-builder-ui/dist/form-builder-ui/browser/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/frontend/form-builder/

    - echo "Form Builder UI deployed successfully to $PROD_DEPLOY_PATH/frontend/form-builder"
  artifacts:
    paths:
      - apps/form-builder-ui/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
