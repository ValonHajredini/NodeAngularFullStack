workflow:
  rules:
    # Run specific pipeline based on PIPELINE variable
    - if: $CI_COMMIT_BRANCH == "production" && $PIPELINE == "shared"
      variables:
        PIPELINE_NAME: "Shared Package"
    - if: $CI_COMMIT_BRANCH == "production" && $PIPELINE == "backend"
      variables:
        PIPELINE_NAME: "Backend API (Forms)"
    - if: $CI_COMMIT_BRANCH == "production" && $PIPELINE == "frontend-web"
      variables:
        PIPELINE_NAME: "Frontend - Main UI"
    - if: $CI_COMMIT_BRANCH == "production" && $PIPELINE == "frontend-form-builder"
      variables:
        PIPELINE_NAME: "Frontend - Form Builder"
    # Run all pipelines if no PIPELINE variable specified
    - if: $CI_COMMIT_BRANCH == "production"
      variables:
        PIPELINE_NAME: "Full Deployment"

stages:
  - install-deps
  - build-shared
  - build-backend
  - deploy-backend
  - build-frontend-web
  - build-frontend-form-builder
  - deploy-frontend

# Global cache - using v2 to invalidate old cache
cache:
  key: ${CI_COMMIT_REF_SLUG}-v2
  paths:
    - node_modules/
    - apps/*/node_modules/
    - packages/*/node_modules/

# ============================================
# STAGE 1: Install All Dependencies
# ============================================
install_dependencies:
  stage: install-deps
  image: node:20-alpine
  timeout: 30m
  cache: {}  # Disable cache for this job to force fresh install
  script:
    - echo "=========================================="
    - echo "Installing All Dependencies"
    - echo "=========================================="
    - echo "Node version:" && node --version
    - echo "NPM version:" && npm --version
    - echo ""

    - echo "📦 Removing any existing node_modules..."
    - rm -rf node_modules
    - rm -rf apps/*/node_modules
    - rm -rf packages/*/node_modules

    - echo ""
    - echo "🔍 Checking package.json and package-lock.json..."
    - ls -lh package.json package-lock.json

    - echo ""
    - echo "📦 Installing root and workspace dependencies..."
    - npm ci --no-audit --loglevel=verbose 2>&1 | tail -100

    - echo ""
    - echo "🔍 Verifying installations..."
    - echo "Root node_modules count:" && ls node_modules | wc -l
    - echo "Root node_modules size:" && du -sh node_modules
    - echo ""
    - echo "Checking critical dependencies:"
    - echo "  - TypeScript:" && ls -lh node_modules/.bin/tsc || echo "❌ TypeScript NOT found"
    - echo "  - Angular CLI:" && ls -lh node_modules/.bin/ng || echo "❌ Angular CLI NOT found"
    - echo ""
    - echo "Workspace node_modules:"
    - echo "  - dashboard-api:" && ls apps/dashboard-api/node_modules 2>&1 | head -5 || echo "No separate node_modules (hoisted)"
    - echo "  - forms-api:" && ls apps/forms-api/node_modules 2>&1 | head -5 || echo "No separate node_modules (hoisted)"
    - echo "  - web:" && ls apps/web/node_modules 2>&1 | head -5 || echo "No separate node_modules (hoisted)"
    - echo "  - shared:" && ls packages/shared/node_modules 2>&1 | head -5 || echo "No separate node_modules (hoisted)"

    - echo ""
    - echo "✅ Dependencies installed successfully"
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
      - package-lock.json
    expire_in: 1 hour
  rules:
    # Always run for all pipelines (dependencies needed by all)
    - if: $CI_COMMIT_BRANCH == "production"

# ============================================
# STAGE 2: Build Shared Package
# ============================================
build_shared_package:
  stage: build-shared
  image: node:20-alpine
  timeout: 15m
  cache: {}  # Disable cache, use only artifacts
  dependencies:
    - install_dependencies
  script:
    - echo "=========================================="
    - echo "Building Shared Package"
    - echo "=========================================="

    - echo "🔍 Checking artifacts received..."
    - echo "Root node_modules exists:" && ls -d node_modules || echo "❌ node_modules NOT found"
    - echo "Root node_modules count:" && ls node_modules 2>/dev/null | wc -l || echo "0"
    - echo ""

    - echo "🔍 Verifying TypeScript availability..."
    - if [ -f "node_modules/.bin/tsc" ]; then
        echo "✅ TypeScript found at node_modules/.bin/tsc";
        node_modules/.bin/tsc --version;
      else
        echo "❌ TypeScript NOT found in node_modules/.bin/";
        echo "Listing node_modules/.bin/ contents:";
        ls -la node_modules/.bin/ | head -20 || echo "node_modules/.bin/ does not exist";
        exit 1;
      fi

    - echo ""
    - echo "📦 Building shared package..."
    - cd packages/shared
    - echo "Current directory:" && pwd
    - echo "Shared package contents:" && ls -la
    - echo ""
    - echo "Running TypeScript build..."
    - ../../node_modules/.bin/tsc --project tsconfig.json

    - echo ""
    - echo "✅ Shared package built successfully"
    - ls -la dist/
  artifacts:
    paths:
      - packages/shared/dist/
    expire_in: 1 hour
  rules:
    # Run for shared pipeline or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "shared" || $PIPELINE == null)

# ============================================
# STAGE 3A: Build Main API
# ============================================
build_api:
  stage: build-backend
  image: node:20-alpine
  timeout: 15m
  dependencies:
    - install_dependencies
    - build_shared_package
  script:
    - echo "=========================================="
    - echo "Building Main API"
    - echo "=========================================="

    - echo "🔍 Checking api structure..."
    - ls -la apps/api/
    - echo ""
    - echo "🔍 Checking src directory..."
    - ls -la apps/api/src/

    - echo ""
    - echo "🔍 Checking for TypeScript config..."
    - cat apps/api/tsconfig.json

    - echo ""
    - echo "🔧 Rebuilding native dependencies for current architecture..."
    - npm rebuild
    - echo ""
    - echo "📦 Building api..."
    - cd apps/api
    - npm run build

    - echo ""
    - echo "✅ Main API built successfully"
    - ls -la dist/
  artifacts:
    paths:
      - apps/api/dist/
    expire_in: 1 hour
  rules:
    # Run for backend or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "backend" || $PIPELINE == null)

# ============================================
# STAGE 3B: Build Forms API
# ============================================
build_forms_api:
  stage: build-backend
  image: node:20-alpine
  timeout: 15m
  dependencies:
    - install_dependencies
    - build_shared_package
  script:
    - echo "=========================================="
    - echo "Building Forms API"
    - echo "=========================================="

    - echo "🔍 Checking forms-api structure..."
    - ls -la apps/forms-api/
    - echo ""
    - echo "🔍 Checking src directory..."
    - ls -la apps/forms-api/src/

    - echo ""
    - echo "🔍 Checking for TypeScript config..."
    - cat apps/forms-api/tsconfig.json

    - echo ""
    - echo "🔧 Rebuilding native dependencies for current architecture..."
    - npm rebuild
    - echo ""
    - echo "📦 Building forms-api..."
    - cd apps/forms-api
    - npm run build

    - echo ""
    - echo "✅ Forms API built successfully"
    - ls -la dist/
  artifacts:
    paths:
      - apps/forms-api/dist/
    expire_in: 1 hour
  rules:
    # Run for backend or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "backend" || $PIPELINE == null)

# ============================================
# STAGE 4: Deploy Forms API with PM2
# ============================================
deploy_forms_api:
  stage: deploy-backend
  image: node:20-alpine
  timeout: 15m
  dependencies:
    - build_shared_package
    - build_forms_api
  before_script:
    - echo "=========================================="
    - echo "Preparing Backend API Deployment"
    - echo "=========================================="

    # Install SSH client
    - apk add --no-cache openssh-client rsync

    # Setup SSH
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts

    - echo "✅ SSH configured for $PROD_SSH_USER@$PROD_SSH_HOST"
  script:
    - echo "=========================================="
    - echo "Deploying Backend API to Production"
    - echo "=========================================="

    # Create deployment directory structure on server
    - echo "📁 Creating directory structure..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/{apps/forms-api,packages/shared,scripts}"

    # Copy shared package dist
    - echo ""
    - echo "📦 Copying shared package..."
    - rsync -avz --delete packages/shared/dist/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/dist/
    - rsync -avz packages/shared/package.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/

    # Copy forms-api source files
    - echo ""
    - echo "📦 Copying forms-api..."
    - rsync -avz --delete --exclude 'node_modules' --exclude 'coverage' --exclude 'logs' --exclude 'uploads' --exclude 'exports' apps/forms-api/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/apps/forms-api/

    # Copy root package files
    - echo ""
    - echo "📦 Copying root configuration..."
    - rsync -avz package.json package-lock.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/
    - rsync -avz ecosystem.config.js $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/
    - rsync -avz scripts/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/scripts/

    # Install production dependencies for forms-api
    - echo ""
    - echo "📦 Installing production dependencies for forms-api..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "cd $PROD_DEPLOY_PATH/apps/forms-api && npm install --production --no-audit --loglevel=error"

    # Deploy forms-api with PM2
    - echo ""
    - echo "🚀 Deploying forms-api with PM2..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "cd $PROD_DEPLOY_PATH && pm2 restart forms-api || pm2 start ecosystem.config.js --only forms-api"

    - echo ""
    - echo "✅ Backend API deployment completed"
  rules:
    # Run for backend or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "backend" || $PIPELINE == null)

# ============================================
# STAGE 4B: Deploy Main API with PM2
# ============================================
deploy_api:
  stage: deploy-backend
  image: node:20-alpine
  timeout: 15m
  dependencies:
    - build_shared_package
    - build_api
  before_script:
    - echo "=========================================="
    - echo "Preparing Main API Deployment"
    - echo "=========================================="

    # Install SSH client
    - apk add --no-cache openssh-client rsync

    # Setup SSH
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts

    - echo "✅ SSH configured for $PROD_SSH_USER@$PROD_SSH_HOST"
  script:
    - echo "=========================================="
    - echo "Deploying Main API to Production"
    - echo "=========================================="

    # Create deployment directory structure on server
    - echo "📁 Creating directory structure..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/{apps/api,packages/shared,scripts}"

    # Copy shared package dist
    - echo ""
    - echo "📦 Copying shared package..."
    - rsync -avz --delete packages/shared/dist/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/dist/
    - rsync -avz packages/shared/package.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/packages/shared/

    # Copy api source files
    - echo ""
    - echo "📦 Copying api..."
    - rsync -avz --delete --exclude 'node_modules' --exclude 'coverage' --exclude 'logs' --exclude 'uploads' --exclude 'exports' apps/api/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/apps/api/

    # Copy root package files
    - echo ""
    - echo "📦 Copying root configuration..."
    - rsync -avz package.json package-lock.json $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/
    - rsync -avz ecosystem.config.js $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/
    - rsync -avz scripts/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/scripts/

    # Install production dependencies for api
    - echo ""
    - echo "📦 Installing production dependencies for api..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "cd $PROD_DEPLOY_PATH/apps/api && npm install --production --no-audit --loglevel=error"

    # Deploy api with PM2
    - echo ""
    - echo "🚀 Deploying api with PM2..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "cd $PROD_DEPLOY_PATH && pm2 restart api || pm2 start ecosystem.config.js --only api"

    - echo ""
    - echo "✅ Main API deployment completed"
  rules:
    # Run for backend or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "backend" || $PIPELINE == null)

# ============================================
# STAGE 5: Build Frontend - Main UI (apps/web)
# ============================================
build_frontend_web:
  stage: build-frontend-web
  image: node:20-alpine
  timeout: 20m
  dependencies:
    - install_dependencies
    - build_shared_package
  script:
    - echo "=========================================="
    - echo "Building Main UI (apps/web)"
    - echo "=========================================="

    - echo "🔍 Verifying Angular CLI..."
    - npx ng version || echo "Angular CLI will be used via npx"

    - echo ""
    - echo "🔧 Rebuilding native dependencies for current architecture..."
    - npm rebuild
    - echo ""
    - echo "📦 Building main UI with production configuration..."
    - npm --workspace=apps/web run build -- --configuration=production

    - echo ""
    - echo "✅ Main UI built successfully"
    - ls -la apps/web/dist/web/browser/
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  rules:
    # Run for frontend-web pipeline or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "frontend-web" || $PIPELINE == null)

# ============================================
# STAGE 6: Build Frontend - Form Builder (apps/form-builder-ui)
# ============================================
build_frontend_form_builder:
  stage: build-frontend-form-builder
  image: node:20-alpine
  timeout: 20m
  dependencies:
    - install_dependencies
    - build_shared_package
  script:
    - echo "=========================================="
    - echo "Building Form Builder UI"
    - echo "=========================================="

    - echo "🔍 Verifying Angular CLI..."
    - npx ng version || echo "Angular CLI will be used via npx"

    - echo ""
    - echo "🔧 Rebuilding native dependencies for current architecture..."
    - npm rebuild
    - echo ""
    - echo "📦 Building form builder UI with production configuration..."
    - npm --workspace=apps/form-builder-ui run build -- --configuration=production

    - echo ""
    - echo "✅ Form Builder UI built successfully"
    - ls -la apps/form-builder-ui/dist/form-builder-ui/browser/
  artifacts:
    paths:
      - apps/form-builder-ui/dist/
    expire_in: 1 hour
  rules:
    # Run for frontend-form-builder pipeline or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "frontend-form-builder" || $PIPELINE == null)

# ============================================
# STAGE 7: Deploy Frontend Applications
# ============================================
deploy_frontend_web:
  stage: deploy-frontend
  image: node:20-alpine
  timeout: 10m
  dependencies:
    - build_frontend_web
  before_script:
    - echo "=========================================="
    - echo "Preparing Main UI Deployment"
    - echo "=========================================="

    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts

    - echo "✅ SSH configured"
  script:
    - echo "=========================================="
    - echo "Deploying Main UI to Production"
    - echo "=========================================="

    - echo "📁 Creating deployment directory..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/frontend/web"

    - echo ""
    - echo "🗑️  Clearing old files..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "rm -rf $PROD_DEPLOY_PATH/frontend/web/*"

    - echo ""
    - echo "📦 Deploying built files..."
    - rsync -avz --delete apps/web/dist/web/browser/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/frontend/web/

    - echo ""
    - echo "✅ Main UI deployed to $PROD_DEPLOY_PATH/frontend/web"
  rules:
    # Run for frontend-web pipeline or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "frontend-web" || $PIPELINE == null)

deploy_frontend_form_builder:
  stage: deploy-frontend
  image: node:20-alpine
  timeout: 10m
  dependencies:
    - build_frontend_form_builder
  before_script:
    - echo "=========================================="
    - echo "Preparing Form Builder Deployment"
    - echo "=========================================="

    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SSH_HOST >> ~/.ssh/known_hosts

    - echo "✅ SSH configured"
  script:
    - echo "=========================================="
    - echo "Deploying Form Builder to Production"
    - echo "=========================================="

    - echo "📁 Creating deployment directory..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "mkdir -p $PROD_DEPLOY_PATH/frontend/form-builder"

    - echo ""
    - echo "🗑️  Clearing old files..."
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "rm -rf $PROD_DEPLOY_PATH/frontend/form-builder/*"

    - echo ""
    - echo "📦 Deploying built files..."
    - rsync -avz --delete apps/form-builder-ui/dist/form-builder-ui/browser/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/frontend/form-builder/

    - echo ""
    - echo "✅ Form Builder deployed to $PROD_DEPLOY_PATH/frontend/form-builder"
  rules:
    # Run for frontend-form-builder pipeline or full deployment
    - if: $CI_COMMIT_BRANCH == "production" && ($PIPELINE == "frontend-form-builder" || $PIPELINE == null)
